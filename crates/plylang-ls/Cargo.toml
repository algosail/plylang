[package]
name = "plylang-ls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "plylang-ls"
path = "src/main.rs"

[dependencies]
plylang = { path = "../plylang" }
lsp-server = "0.7"
lsp-types = "0.95"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# lsp-types accepts any url 2.x. url 2.5.5+ and idna_adapter 1.2.1+ pull ICU 2.4,
# which needs rustc 1.88. These pins keep the language server on rustc 1.87.
url = "=2.5.4"
idna = "=1.0.3"
idna_adapter = "=1.2.0"
