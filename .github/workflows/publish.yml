# Publishes when a GitHub release is published.
# The tag must be `v` plus the version in package.json.
# Repository secret NPM_TOKEN is an npm token that can publish @plylang/*.

name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: node script/check-release.js
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      # The usage test launches this debug binary.
      - run: cargo build -p plylang -p plylang-ls
      - run: node --test bin/native.test.js script/stage-native.test.js
      - run: cargo test --workspace -- --test-threads=8

  native:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: win32-arm64
            runner: windows-11-arm
          - platform: win32-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p plylang -p plylang-ls
      - run: node script/stage-native.js ${{ matrix.platform }} target/release staging
      - run: npm publish --provenance --access public
        working-directory: staging
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  package:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: node script/check-release.js
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
